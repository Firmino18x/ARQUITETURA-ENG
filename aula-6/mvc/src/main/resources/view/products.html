<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Produtos</title>
</head>
<body>
    <div th:replace="~{fragments :: topbar('/products')}"></div>
    <header>
        <h1>Produtos</h1>
    </header>
    <main>
        <section>
            <h2>Novo Produto</h2>
            <form th:action="@{/products}" th:object="${product}" method="post">
                <div>
                    <label for="name">Nome:</label>
                    <input id="name" type="text" th:field="*{name}" required>
                </div>
                <div>
                    <label for="price">Valor:</label>
                    <input id="price" type="number" step="0.01" min="0" th:field="*{price}" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
            <p class="hint">Todo produto novo começa como <strong>Indisponível</strong>, com estoque zero.</p>
        </section>
        <section>
            <h2>Produtos Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Valor</th>
                        <th>Estoque</th>
                        <th>Status</th>
                        <th th:if="${currentRole.name() == 'ADM'}">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${products}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.name}"></td>
                        <td th:text="${p.price}"></td>
                        <td th:text="${p.quantity}"></td>
                        <td><span th:class="'status ' + ${p.status}" th:text="${p.status.label}"></span></td>
                        <td th:if="${currentRole.name() == 'ADM'}">
                            <form th:unless="${p.discontinued}" th:action="@{/products/{id}/discontinue(id=${p.id})}" method="post">
                                <button type="submit" class="danger">Descontinuar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer>
        Projeto de compreensão do MVC
    </footer>
</body>
</html>
